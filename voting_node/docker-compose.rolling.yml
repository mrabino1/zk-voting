# NOT FOR PROFIT — civic public good, not a commercial product.
#
# Overlap smoke for a Coolify-style rolling update. Start this beside the
# main compose file so a second Node mounts the same volume. The second
# process must stay healthy while mode is standby.
#
#   docker compose -f docker-compose.yml -f docker-compose.rolling.yml up -d --no-build node-next
#   curl -fsS http://127.0.0.1:3001/health    # "mode":"standby"
#   curl -fsS http://127.0.0.1:3000/health    # "mode":"active"
#
# There is no l2-next. The rollup operator has no writer lease yet, and two
# operators on one l2-data volume would commit conflicting batches. Update the
# l2 service by recreating it (stop, then start). While it is down the node
# answers ballot submissions with 503 L2_UNREACHABLE and the voter retries;
# nothing is lost, because a ballot is only accepted once the operator queues it.

name: zk-voting

services:
  node-next:
    image: zk-voting-node:${ZK_VOTING_IMAGE_TAG:-local}
    restart: "no"
    init: true
    stop_grace_period: 30s
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to postgres://USER:PASSWORD@db:5432/DB}
      CHAIN_ID: ${CHAIN_ID:-27427}
      VOTE_FQDN: ${VOTE_FQDN:-}
      RP_ID: ${RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_HANDLE: ${ADMIN_HANDLE:-admin}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Same runtime value as the active Node. Standby does not write it.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Empty or omitted is a real election. Set true or 1 only on the public demo.
      IS_DEMO: ${IS_DEMO:-}
      DISCLOSURE_INTERVAL_SECONDS: ${DISCLOSURE_INTERVAL_SECONDS:-3600}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-}
      # Same rollup settings as the active Node. Standby does not send L1 transactions.
      L1_RPC: ${L1_RPC:-http://l1:8545}
      L1_RPC_AUTH_TOKEN: ${L1_RPC_AUTH_TOKEN:-}
      L1_CHAIN_ID: ${L1_CHAIN_ID:-}
      ROLLUP_ADDRESS: ${ROLLUP_ADDRESS:-}
      ROLLUP_DEPLOYMENT_FILE: ${ROLLUP_DEPLOYMENT_FILE:-}
      ROLLUP_JURISDICTION_ID: ${ROLLUP_JURISDICTION_ID:-}
      ROLLUP_PRIVATE_KEY: ${ROLLUP_PRIVATE_KEY:-}
      L2_URL: http://l2:8546
      L2_BALLOT_TOKEN: ${L2_BALLOT_TOKEN:?Set L2_BALLOT_TOKEN}
      # Empty or false: l2 exits if the rollup is not usable. 1: l2 stays up
      # degraded and retries. The node reports that state from l2 /health.
      L2_ALLOW_DEGRADED: ${L2_ALLOW_DEGRADED:-}
    volumes:
      - node-data:/data
      - l1-deployment:/deployments:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - zk-voting

volumes:
  node-data:
  l1-deployment:

networks:
  zk-voting:
    driver: bridge
