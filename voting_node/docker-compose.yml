# NOT FOR PROFIT — civic public good, not a commercial product.
#
# Host the ZK-Voting Node (API + SPA) and its L2 rollup operator the same way
# a frontend repo is hosted: one compose file, images built from this tree,
# data on volumes, secrets via .env (never baked into the image).
#
#   ./setup.sh              # or: cp .env.example .env and fill it in
#   docker compose up -d --build
#   curl -fsS http://127.0.0.1:3000/health
#
# Services:
#   node       API + SPA. Polls run here; civic votes are published to L1.
#   l2         rollup operator: follows ZkVotingRollup on L1, takes ballots from
#              the node, commits and executes batches.
#   db         Postgres for node state.
#   l1         (profile local-l1) Anvil on chain 31337, state on a volume.
#   l1-deploy  (profile local-l1) one-shot: deploys ZkVotingRollup with
#              script/DeployLocal.s.sol unless it is already on the chain, and
#              writes the record the node and l2 read (ROLLUP_DEPLOYMENT_FILE).
#
# Local stack: COMPOSE_PROFILES=local-l1 (the .env.example default). On a
# public chain, unset COMPOSE_PROFILES and set L1_RPC and ROLLUP_ADDRESS to
# the one shared deployment (tools/deploy). Anvil's dev keys are refused off
# chain 31337. depends_on `required: false` needs Docker Compose 2.20+.
#
# system_actions.sh restart/logs/status pick this file up automatically.

name: zk-voting

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: zk-voting-node:${ZK_VOTING_IMAGE_TAG:-local}
    container_name: zk-voting-node
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${ZK_VOTING_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      # App state is Postgres on the db service. Compose refuses to start
      # until the operator sets this. There is no default password.
      # Example: postgres://USER:PASSWORD@db:5432/DB
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to postgres://USER:PASSWORD@db:5432/DB}
      CHAIN_ID: ${CHAIN_ID:-27427}
      # Setup entropy (/setup steps 3-4). ZK_ENTROPY is a secret.
      ENTROPY_CEREMONY_URL: ${ENTROPY_CEREMONY_URL:-}
      ZK_ENTROPY: ${ZK_ENTROPY:-}
      # Product name defaults; Site admin > Branding wins. Empty = "ZK-Voting".
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-}
      # Public voting hostname (vote.domain.tld). Empty = localhost demo.
      # When set, the Node treats it as the voting authority unless RP_ID is
      # some other public hostname. See README § Intentional forking.
      VOTE_FQDN: ${VOTE_FQDN:-}
      RP_ID: ${RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_HANDLE: ${ADMIN_HANDLE:-admin}
      # Secret. When set, /setup asks for it before creating the super admin.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Runtime only. Do not bake this into the image. Empty leaves contactEmail alone.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Empty or omitted is a real election. Set true or 1 only on the public demo.
      IS_DEMO: ${IS_DEMO:-}
      DISCLOSURE_INTERVAL_SECONDS: ${DISCLOSURE_INTERVAL_SECONDS:-3600}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-}
      ALLOW_SMART_CARD_MOCK: ${ALLOW_SMART_CARD_MOCK:-}
      ALLOW_CIVIC_ID_MOCK: ${ALLOW_CIVIC_ID_MOCK:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_ENDPOINT: ${SES_ENDPOINT:-}
      SES_DRY_RUN: ${SES_DRY_RUN:-}
      REQUIRE_EMAIL_MFA: ${REQUIRE_EMAIL_MFA:-}
      FEEDBACK_RATE_WINDOW_SECONDS: ${FEEDBACK_RATE_WINDOW_SECONDS:-3600}
      FEEDBACK_MIN_SUBMIT_MS: ${FEEDBACK_MIN_SUBMIT_MS:-3000}
      FEEDBACK_MAX_BODY_BYTES: ${FEEDBACK_MAX_BODY_BYTES:-16384}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CREDENTIAL_PROVIDER_SECRET: ${CREDENTIAL_PROVIDER_SECRET:-}
      CREDENTIAL_PROVIDER_ID: ${CREDENTIAL_PROVIDER_ID:-manual}
      RECEIPT_PDF_SECRET: ${RECEIPT_PDF_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EXPLORER_INGEST_SECRET: ${EXPLORER_INGEST_SECRET:-}
      # ZkVotingRollup (smart-contracts/docs/ROLLUP.md). The node account is the
      # jurisdiction's clerk on L1: it publishes, closes and finalizes civic votes.
      L1_RPC: ${L1_RPC:-http://l1:8545}
      L1_CHAIN_ID: ${L1_CHAIN_ID:-}
      ROLLUP_ADDRESS: ${ROLLUP_ADDRESS:-}
      ROLLUP_DEPLOYMENT_FILE: ${ROLLUP_DEPLOYMENT_FILE:-}
      ROLLUP_JURISDICTION_ID: ${ROLLUP_JURISDICTION_ID:-}
      ROLLUP_PRIVATE_KEY: ${ROLLUP_PRIVATE_KEY:-}
      ROLLUP_TICK_SECONDS: ${ROLLUP_TICK_SECONDS:-15}
      L2_URL: http://l2:8546
      L2_BALLOT_TOKEN: ${L2_BALLOT_TOKEN:?Set L2_BALLOT_TOKEN (./setup.sh mints one)}
    volumes:
      - node-data:/data
      - l1-deployment:/deployments:ro
    depends_on:
      db:
        condition: service_healthy
      l2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zk-voting

  l2:
    build:
      context: .
      dockerfile: l2/Dockerfile
    image: zk-voting-l2:${ZK_VOTING_IMAGE_TAG:-local}
    container_name: zk-voting-l2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["node", "rollup/main.mjs"]
    # The ballot API needs L2_BALLOT_TOKEN, and the node reaches it on the compose
    # network (http://l2:8546). Publish it on the host loopback only; set
    # L2_RPC_BIND=0.0.0.0 to expose the public reads (/v1/status, /v1/batches) on purpose.
    ports:
      - "${L2_RPC_BIND:-127.0.0.1}:${L2_RPC_PORT:-8546}:8546"
    environment:
      L2_RPC_HOST: "0.0.0.0"
      L2_RPC_PORT: "8546"
      L2_DATA_DIR: /data
      L1_RPC: ${L1_RPC:-http://l1:8545}
      L1_CHAIN_ID: ${L1_CHAIN_ID:-}
      ROLLUP_ADDRESS: ${ROLLUP_ADDRESS:-}
      ROLLUP_DEPLOYMENT_FILE: ${ROLLUP_DEPLOYMENT_FILE:-}
      # An operator registered on the rollup (setOperator). Pays L1 gas for batches.
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:?Set OPERATOR_PRIVATE_KEY}
      L2_BALLOT_TOKEN: ${L2_BALLOT_TOKEN:?Set L2_BALLOT_TOKEN (./setup.sh mints one)}
      L2_BATCH_SECONDS: ${L2_BATCH_SECONDS:-10}
      # Chain 31337 only: accept ballots without a zero-knowledge eligibility proof
      # (the node's vote pass still gates them). The operator refuses it elsewhere.
      ZK_VOTING_ALLOW_MOCK_PROOFS: ${ZK_VOTING_ALLOW_MOCK_PROOFS:-}
    volumes:
      - l2-data:/data
      - l1-deployment:/deployments:ro
    depends_on:
      l1-deploy:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.L2_RPC_PORT||8546)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zk-voting

  # Local L1 (chain 31337). Its RPC has no auth and its dev keys are public:
  # it binds the host loopback only. State survives restarts on l1-data.
  l1:
    profiles: ["local-l1"]
    image: ghcr.io/foundry-rs/foundry:v1.10.0@sha256:03ca6dc0accb53b6f67278b5a1c70bef984d5a2a2bcb197298c3b6f3b929c798
    container_name: zk-voting-l1
    restart: unless-stopped
    init: true
    # Root only so Anvil can write its state to a fresh named volume.
    user: "0:0"
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--state", "/data/anvil-state.json", "--state-interval", "30"]
    ports:
      - "127.0.0.1:${L1_RPC_PORT:-8545}:8545"
    volumes:
      - l1-data:/data
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zk-voting

  # One-shot deploy of ZkVotingRollup to the local L1. Skips when the recorded
  # address already has code. Compiles from ../smart-contracts (needs network
  # once, to fetch solc). Deployer = Anvil account 0 (governor), operator =
  # account 1, node clerk = account 2: their keys are public test keys.
  l1-deploy:
    profiles: ["local-l1"]
    image: ghcr.io/foundry-rs/foundry:v1.10.0@sha256:03ca6dc0accb53b6f67278b5a1c70bef984d5a2a2bcb197298c3b6f3b929c798
    container_name: zk-voting-l1-deploy
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rpc=http://l1:8545
        if [ -f /deployments/local.json ]; then
          addr=$$(tr -d ' \n' < /deployments/local.json | sed -n 's/.*"rollup":"\(0x[0-9a-fA-F]\{40\}\)".*/\1/p')
          if [ -n "$$addr" ] && [ "$$(cast code "$$addr" --rpc-url "$$rpc")" != "0x" ]; then
            echo "ZkVotingRollup already deployed at $$addr"
            exit 0
          fi
        fi
        rm -rf /work && cp -r /contracts /work && rm -rf /work/out /work/cache /work/broadcast /work/deployments
        mkdir -p /work/deployments
        cd /work
        forge script script/DeployLocal.s.sol --rpc-url "$$rpc" --broadcast --slow
        cp deployments/local.json /deployments/local.json.tmp
        mv /deployments/local.json.tmp /deployments/local.json
        cat /deployments/local.json
    environment:
      OPERATOR: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      CLERK: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
    volumes:
      - ../smart-contracts:/contracts:ro
      - l1-deployment:/deployments
    depends_on:
      l1:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - zk-voting

  # Node app state. Not published on the host. The operator sets the
  # role, the password, and DATABASE_URL. Compose ships no password.
  db:
    image: postgres:16-alpine
    container_name: zk-voting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zk-voting

volumes:
  node-data:
  l2-data:
  l1-data:
  l1-deployment:
  postgres-data:

networks:
  zk-voting:
    driver: bridge
