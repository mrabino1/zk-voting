# NOT FOR PROFIT — civic public good, not a commercial product.
#
# One-click deploy for Coolify (Docker Compose build pack). Nothing to type before the
# first deploy: Coolify generates the database password and the setup token, gives the
# site a domain, and the rest is chosen in the browser at /setup.
#
#   Coolify: + New → Public Repository → your fork → Build pack: Docker Compose
#            Base Directory: /voting_node
#            Docker Compose Location: /docker-compose.coolify.yml
#            Deploy, then open the domain Coolify shows for the "node" service.
#
# Full guide: docs/self-hosting/coolify.md. For plain Docker Compose on your own server,
# use docker-compose.yml and ./setup.sh instead.
#
# How the pieces find each other without hand-typed variables:
#   - SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES / SERVICE_PASSWORD_SETUP are
#     Coolify "magic" variables: generated on the first deploy, kept on every redeploy,
#     visible (and editable) under the resource's Environment Variables.
#   - SERVICE_FQDN_NODE_3000 asks Coolify for a domain routed to the node's port 3000.
#     Coolify then injects COOLIFY_FQDN / COOLIFY_URL, and the node uses them as its
#     public address (apps/node/src/platformEnv.mjs). Set your own domain in Coolify
#     before voters register passkeys: passkeys are bound to the host name.
#   - The "install" volume is shared by node and l2. It holds the ballot token they share
#     and whatever /setup decides about civic votes (packages/chain-client/install.js).
#
# Every variable below that ends in ":-}" is optional. Set it in Coolify to override
# what /setup would choose; a value set there always wins.

name: zk-voting

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    init: true
    stop_grace_period: 30s
    environment:
      SERVICE_FQDN_NODE_3000:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      INSTALL_DIR: /install
      # Saving on /setup restarts the process; restart: unless-stopped brings it back.
      RESTART_ON_SETUP: "1"
      # The node builds DATABASE_URL from these (host "db").
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-zkvoting}
      POSTGRES_HOST: db
      # Protects /setup until you claim the site. Find the value under Environment
      # Variables (SERVICE_PASSWORD_SETUP) and type it on the setup screen.
      SETUP_TOKEN: ${SERVICE_PASSWORD_SETUP}
      ADMIN_HANDLE: ${ADMIN_HANDLE:-admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Optional overrides. Empty = derived from Coolify's domain or chosen on /setup.
      VOTE_FQDN: ${VOTE_FQDN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CHAIN_ID: ${CHAIN_ID:-}
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-}
      ENTROPY_CEREMONY_URL: ${ENTROPY_CEREMONY_URL:-}
      ZK_ENTROPY: ${ZK_ENTROPY:-}
      IS_DEMO: ${IS_DEMO:-}
      # Email (sign-in codes, receipts). Optional; see docs/self-hosting/configuration.md.
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RECEIPT_PDF_SECRET: ${RECEIPT_PDF_SECRET:-}
      DISCLOSURE_INTERVAL_SECONDS: ${DISCLOSURE_INTERVAL_SECONDS:-3600}
      # Civic votes. Empty = whatever /setup chose. Setting any of these fixes it here.
      L1_RPC: ${L1_RPC:-}
      L1_RPC_AUTH_TOKEN: ${L1_RPC_AUTH_TOKEN:-}
      L1_CHAIN_ID: ${L1_CHAIN_ID:-}
      ROLLUP_ADDRESS: ${ROLLUP_ADDRESS:-}
      ROLLUP_JURISDICTION_ID: ${ROLLUP_JURISDICTION_ID:-}
      ROLLUP_PRIVATE_KEY: ${ROLLUP_PRIVATE_KEY:-}
      ROLLUP_DEPLOY_BLOCK: ${ROLLUP_DEPLOY_BLOCK:-}
      # Whether OPERATOR_PRIVATE_KEY is set for l2 ("1" or empty), so /setup leaves the
      # rollup settings alone. The key itself stays in the l2 container.
      OPERATOR_PRIVATE_KEY_SET: ${OPERATOR_PRIVATE_KEY:+1}
      L2_URL: http://l2:8546
    volumes:
      - node-data:/data
      - install:/install
      - l1-deployment:/deployments:ro
    depends_on:
      db:
        condition: service_healthy
      # l2 is healthy in standby too, so the site comes up before civic votes are set up.
      l2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  l2:
    build:
      context: .
      dockerfile: l2/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    init: true
    stop_grace_period: 30s
    command: ["node", "rollup/main.mjs"]
    environment:
      L2_RPC_HOST: "0.0.0.0"
      L2_RPC_PORT: "8546"
      L2_DATA_DIR: /data
      INSTALL_DIR: /install
      # Until /setup chooses how civic votes are counted, wait instead of exiting.
      L2_STANDBY_WHEN_UNCONFIGURED: "true"
      L1_RPC: ${L1_RPC:-}
      L1_RPC_AUTH_TOKEN: ${L1_RPC_AUTH_TOKEN:-}
      L1_CHAIN_ID: ${L1_CHAIN_ID:-}
      ROLLUP_ADDRESS: ${ROLLUP_ADDRESS:-}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
      L2_BATCH_SECONDS: ${L2_BATCH_SECONDS:-10}
      L2_BATCH_MAX_WAIT_SECONDS: ${L2_BATCH_MAX_WAIT_SECONDS:-}
    volumes:
      - l2-data:/data
      - install:/install
      - l1-deployment:/deployments:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.L2_RPC_PORT||8546)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-zkvoting}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The built-in test chain (Ethereum chain id 31337), used when /setup picks
  # "Built-in test chain". Private to this deployment, no host port, public test keys,
  # nothing of value. It idles (a few tens of MB) when you choose polls only.
  l1:
    image: ghcr.io/foundry-rs/foundry:v1.10.0@sha256:03ca6dc0accb53b6f67278b5a1c70bef984d5a2a2bcb197298c3b6f3b929c798
    restart: unless-stopped
    init: true
    user: "0:0"
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--state", "/data/anvil-state.json", "--state-interval", "30"]
    volumes:
      - l1-data:/data
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Deploys ZkVotingRollup to the test chain once (script/DeployLocal.s.sol) and writes the
  # record node and l2 read. The contracts are compiled into the image at build time, from
  # this repository's own smart-contracts/ folder, so nothing is fetched at run time and no
  # repository files need to stay on the server.
  l1-deploy:
    build:
      context: ../smart-contracts
      dockerfile_inline: |
        FROM ghcr.io/foundry-rs/foundry:v1.10.0@sha256:03ca6dc0accb53b6f67278b5a1c70bef984d5a2a2bcb197298c3b6f3b929c798
        USER root
        COPY . /contracts
        RUN rm -rf /contracts/out /contracts/cache /contracts/broadcast /contracts/deployments \
            && mkdir -p /contracts/deployments \
            && cd /contracts && forge build --skip test
        WORKDIR /contracts
    # A one-shot job: it exits after deploying. Coolify leaves restart "no" services out of
    # the resource's health status, so the finished job does not read as unhealthy.
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        rpc=http://l1:8545
        if [ -f /deployments/local.json ]; then
          addr=$$(tr -d ' \n' < /deployments/local.json | sed -n 's/.*"rollup":"\(0x[0-9a-fA-F]\{40\}\)".*/\1/p')
          if [ -n "$$addr" ] && [ "$$(cast code "$$addr" --rpc-url "$$rpc")" != "0x" ]; then
            echo "ZkVotingRollup already deployed at $$addr"
            exit 0
          fi
        fi
        cd /contracts
        forge script script/DeployLocal.s.sol --rpc-url "$$rpc" --broadcast --slow --skip test
        cp deployments/local.json /deployments/local.json.tmp
        mv /deployments/local.json.tmp /deployments/local.json
        cat /deployments/local.json
    environment:
      # Anvil accounts 1 and 2: the operator and the node's clerk account.
      OPERATOR: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      CLERK: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
    volumes:
      - l1-deployment:/deployments
    depends_on:
      l1:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  node-data:
  l2-data:
  install:
  l1-data:
  l1-deployment:
  postgres-data:
