[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# IR for the whole build, so test bytecode is the bytecode that deploys.
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
# Time windows are the election rules, and loops over bounded lists (≤ 16 guardians,
# ≤ 8 options, ≤ 32 commitments per op) revert by design. The Guardians library runs by
# delegatecall in this contract's own context, so its "external calls" cannot reenter.
exclude_lints = [
    "block-timestamp",
    "require-revert-in-loop",
    "reentrancy-events",
    "calls-loop",
    "unsafe-typecast",
    "uninitialized-local",
    "missing-events-access-control",
]
