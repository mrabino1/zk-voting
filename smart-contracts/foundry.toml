[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# IR for the whole build so test bytecode matches deploy (EIP-170). Do not
# turn this off for tests only; solc 0.8.24 still uses `if (!ok) revert`.
via_ir = true
# The 200M batch-cap test builds and settles 148 four-option rows in one
# transaction (about 1.46B gas). The settlement call itself stays under 200M.
gas_limit = 2000000000
ffi = false
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../circuits/fixtures" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true
check_interval = 1

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
