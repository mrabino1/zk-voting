# NOT FOR PROFIT — civic public good, not a commercial product.
#
# Default CI for the zk-voting monorepo. No repository secrets are required:
# Node tests are in-process, the L2 tests start their own Anvil, and the contract
# tests use MockBatchVerifier (no RPC fork, no Etherscan key). The main test job does not run circom.
# A separate job runs an UNTRUSTED toy Groth16 phase-2 transcript
# (published entropy). That job is not a ceremony.
#
# Local equivalents (from voting_node/). Need Node 24.7+ and Foundry (`foundryup`):
#
#   npm install
#   npm run test:node          # apps/node (includes WCAG 2.2 AA axe checks; needs Chrome)
#   npm run test:packages      # @zk-voting/chain-client, proof-helpers
#   npm run test:l2            # L2 operator, including an end-to-end election on Anvil
#   npm run test:contracts     # forge test (ZkVotingRollup)
#   npm run test:auditor       # tools/auditor, including verify-rollup helpers
#   npm run test:docs          # self-hosting docs, compose files, workflow diagram
#   npm run test:setup         # ./setup.sh
#   npm test                   # all of the above
#   ./scripts/migrations-verify.sh
#                              # no-op SQL check, production build, image boot smoke
#
name: CI

# CI temporarily disabled; restore the commented original triggers to re-enable.
# CI-DISABLED original triggers: on:
# CI-DISABLED original triggers:   push:
# CI-DISABLED original triggers:     branches:
# CI-DISABLED original triggers:       - test/unstable
# CI-DISABLED original triggers:       - master
# CI-DISABLED original triggers:   pull_request:
# CI-DISABLED original triggers:     branches:
# CI-DISABLED original triggers:       - test/unstable
# CI-DISABLED original triggers:       - master
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: voting_node

jobs:
  test:
    name: install / node / l2 / forge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: voting_node/package-lock.json

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
          cache: true

      - name: Cache Forge artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.svm
            smart-contracts/cache
            smart-contracts/out
          key: ${{ runner.os }}-forge-via-ir-${{ hashFiles('smart-contracts/foundry.toml', 'smart-contracts/remappings.txt', 'smart-contracts/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-forge-via-ir-

      - name: Install npm workspaces
        run: npm install --no-audit --no-fund

      - name: Show toolchain
        run: |
          node --version
          npm --version
          forge --version

      - name: Ensure Chrome for axe
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            command -v google-chrome || command -v google-chrome-stable
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Node tests (includes axe WCAG 2.2 AA)
        run: npm run test:node

      - name: Package tests
        run: npm run test:packages

      - name: L2 tests (operator; end to end on Anvil)
        run: npm run test:l2

      - name: Forge tests
        run: npm run test:contracts

      - name: Auditor tests
        run: npm run test:auditor

      - name: Docs artifacts
        run: npm run test:docs

      - name: Setup script tests
        run: npm run test:setup

      - name: How to run locally
        if: always()
        run: |
          {
            echo "## Local equivalents"
            echo
            echo "From the repository root (Node 24.7+ and Foundry via \`foundryup\`). No API keys."
            echo
            echo '```bash'
            echo "npm install"
            echo "npm run test:node          # apps/node, including axe (needs Chrome)"
            echo "npm run test:a11y -w apps/node"
            echo "npm run test:packages      # chain-client, proof-helpers"
            echo "npm run test:l2            # operator; end to end on Anvil"
            echo "npm run test:contracts     # forge test"
            echo "npm run test:auditor       # tools/auditor"
            echo "npm run test:docs          # self-hosting docs, compose, workflow diagram"
            echo "npm run test:setup         # ./setup.sh"
            echo "npm test                   # all of the above"
            echo "docker compose up -d --build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: docker compose (local L1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: voting_node/package-lock.json

      # The same path a self-hoster takes: every default, which is the local L1
      # (Anvil + ZkVotingRollup), the bundled Postgres and generated secrets.
      - name: ./setup.sh -y
        run: ./setup.sh -y --deploy compose

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for Node /health with the rollup connected
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:3000/health || true)"
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"rollupConfigured":true'; then
              echo "node healthy and connected: $body"
              exit 0
            fi
            sleep 5
          done
          echo "node did not become healthy with the rollup connected"
          docker compose ps
          docker compose logs
          exit 1

      - name: L2 operator follows ZkVotingRollup
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8546/health | tee /tmp/l2-health.json
          curl -fsS http://127.0.0.1:8546/v1/status | tee /tmp/l2-status.json
          grep -q '"rollup":"0x' /tmp/l2-status.json
          grep -q '"desertMode":false' /tmp/l2-status.json

      - name: Rolling overlap keeps the standby Node healthy
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.rolling.yml up -d --no-build node-next
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '"mode":"active"' \
              && curl -fsS http://127.0.0.1:3001/health | grep -q '"mode":"standby"'; then
              echo "rolling overlap ok"
              exit 0
            fi
            sleep 3
          done
          echo "rolling overlap did not reach active+standby"
          docker compose -f docker-compose.yml -f docker-compose.rolling.yml ps
          docker compose -f docker-compose.yml -f docker-compose.rolling.yml logs
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.rolling.yml down -v

  ceremony-toy:
    name: untrusted toy phase-2 transcript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: voting_node/package-lock.json

      - name: Install npm workspaces
        run: npm install --no-audit --no-fund

      - name: Run and verify the toy multi-contributor transcript
        run: npm run circuits:ceremony:toy

      - name: What this job is
        if: always()
        run: |
          {
            echo "## Untrusted toy phase-2 transcript"
            echo
            echo "This job compiles \`circuits/ceremony/toy.circom\`, runs three published-entropy Groth16 phase-2 contributions, verifies the transcript, and exports a verifier marked untrusted."
            echo
            echo "It is not a ceremony. Keys stay \`ceremony: not-done\`. See \`docs/CEREMONY.md\`."
            echo
            echo '```bash'
            echo "npm install"
            echo "npm run circuits:ceremony:toy"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  migrations-verify:
    name: migrations-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Migrations (no-op — this repository has no SQL migrations)
        run: ./scripts/migrations-verify.sh migrations

      - name: Production build
        run: npm run build

      - name: Docker build and boot smoke
        run: ./scripts/migrations-verify.sh smoke
