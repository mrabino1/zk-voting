server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets are referenced as file?v=<sha256 prefix> (see check-assets.sh),
    # so a changed file always gets a new URL and stale copies are never reused.
    location ~* \.(css|svg)$ {
        expires 1h;
    }

    # HTML must always be revalidated so browsers pick up new asset versions.
    # 'expires -1' sends Cache-Control: no-cache without add_header, so the
    # server-level security headers (including the CSP) are still inherited.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
